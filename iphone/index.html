<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- No network at all: the page only reads the file the user picks. Inline code is the whole app. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Passwort-Safe">
<meta name="theme-color" content="#900926">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Passwort-Safe</title>
<style>
:root {
  --brand: #900926; --on-brand: #fff; --bg: #fafafa; --surface: #fff; --text: #1d1d1f; --muted: #5f6368;
  --line: #e0e0e0; --chip: #f1f1f1; --error: #b3261e; --ok: #2e7d32;
}
@media (prefers-color-scheme: dark) {
  :root { --brand: #e0475e; --on-brand: #fff; --bg: #121212; --surface: #1e1e1e; --text: #ececec; --muted: #a0a0a0;
          --line: #333; --chip: #2a2a2a; --error: #f2b8b5; --ok: #81c995; }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
[hidden] { display: none !important; }
header { position: sticky; top: 0; z-index: 2; background: var(--brand); color: var(--on-brand);
  display: flex; align-items: center; gap: 8px; padding: 12px 16px; min-height: 56px; }
header h1 { font-size: 19px; margin: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
header small { display: block; font-size: 12px; opacity: .85; font-weight: normal; }
header button { background: none; border: 0; color: inherit; font-size: 15px; padding: 8px; border-radius: 8px; }
main { max-width: 720px; margin: 0 auto; padding: 16px; }
.card { background: var(--surface); border-radius: 14px; padding: 18px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
label.field { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
input[type=password], input[type=text], input[type=search] {
  width: 100%; font-size: 17px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--surface); color: var(--text); }
input:focus { outline: 2px solid var(--brand); border-color: transparent; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; width: 100%; margin-top: 16px;
  padding: 13px 16px; font-size: 17px; font-weight: 600; border-radius: 24px; border: 0;
  background: var(--brand); color: var(--on-brand); }
.btn.outline { background: none; color: var(--brand); border: 1.5px solid var(--brand); }
.btn:disabled { opacity: .45; }
.file-name { margin-top: 8px; font-size: 14px; color: var(--muted); word-break: break-all; }
.error { color: var(--error); margin-top: 12px; font-size: 15px; }
.hint { color: var(--muted); font-size: 13px; margin-top: 18px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--text);
  padding: 7px 14px; border-radius: 18px; font-size: 15px; white-space: nowrap; }
.chip.on { background: var(--brand); border-color: var(--brand); color: var(--on-brand); font-weight: 600; }
ul.list { list-style: none; margin: 8px 0 0; padding: 0; background: var(--surface); border-radius: 14px; overflow: hidden; }
ul.list li { display: flex; align-items: center; border-bottom: 1px solid var(--line); }
ul.list li:last-child { border-bottom: 0; }
ul.list li > button.open { flex: 1; min-width: 0; text-align: left; background: none; border: 0; color: inherit;
  padding: 12px 16px; font: inherit; }
.over { font-size: 12px; color: var(--muted); }
.title { font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sub { font-size: 14px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.icon-btn { flex: none; background: none; border: 0; color: var(--brand); font-size: 14px; font-weight: 600;
  padding: 12px 14px; }
.empty { text-align: center; color: var(--muted); padding: 40px 16px; }
.detail .row { padding: 12px 0; border-bottom: 1px solid var(--line); }
.detail .row:last-child { border-bottom: 0; }
.detail .k { font-size: 13px; color: var(--muted); }
.detail .v { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
.detail .v span { flex: 1; min-width: 0; word-break: break-word; white-space: pre-wrap; font-size: 17px; }
.mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
#toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  background: #323232; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: 90vw;
  opacity: 0; transition: opacity .2s; pointer-events: none; }
#toast.show { opacity: 1; }
</style>
</head>
<body>

<!-- ============ Start: pick file + master password ============ -->
<section id="start">
  <header><h1 data-t="appName"></h1></header>
  <main>
    <div class="card">
      <p data-t="intro" style="margin-top:0"></p>
      <label class="btn outline" for="file" data-t="chooseFile"></label>
      <input id="file" type="file" hidden>
      <div class="file-name" id="fileName"></div>
      <label class="field" for="pw" data-t="masterPassword"></label>
      <input id="pw" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false">
      <button class="btn" id="openBtn" disabled data-t="open"></button>
      <div class="error" id="startError" hidden></div>
      <p class="hint" data-t="readOnlyHint"></p>
    </div>
  </main>
</section>

<!-- ============ List ============ -->
<section id="vault" hidden>
  <header>
    <h1><span data-t="appName"></span><small id="vaultFile"></small></h1>
    <button id="lockBtn" data-t="lock"></button>
  </header>
  <main>
    <input id="search" type="search" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="chips" id="folders"></div>
    <ul class="list" id="entries"></ul>
    <div class="empty" id="emptyHint" hidden></div>
  </main>
</section>

<!-- ============ Detail ============ -->
<section id="detail" hidden>
  <header>
    <button id="backBtn" data-t="back"></button>
    <h1 id="detailTitle"></h1>
  </header>
  <main><div class="card detail" id="detailBody"></div></main>
</section>

<div id="toast" role="status"></div>

<script>
"use strict";
// <core> — file format of Passwort-Safe (same as core/SyncFile.kt). Kept free of DOM code so it can be tested in Node.
const PasswortSafeCore = (() => {
  const MAGIC = new TextEncoder().encode("PSAFE1");
  const SALT_SIZE = 16, IV_SIZE = 12, ITERATIONS = 210000;
  const HEADER_SIZE = MAGIC.length + SALT_SIZE + IV_SIZE;

  class InvalidFileError extends Error {}
  class WrongPasswordError extends Error {}

  function hasMagic(bytes) {
    if (bytes.length <= HEADER_SIZE) return false;
    for (let i = 0; i < MAGIC.length; i++) if (bytes[i] !== MAGIC[i]) return false;
    return true;
  }

  /** Layout: [magic "PSAFE1"][salt 16][IV 12][AES-256-GCM ciphertext + tag], magic as additional data. */
  async function decrypt(bytes, password, subtle = crypto.subtle) {
    if (!hasMagic(bytes)) throw new InvalidFileError();
    const salt = bytes.slice(MAGIC.length, MAGIC.length + SALT_SIZE);
    const iv = bytes.slice(MAGIC.length + SALT_SIZE, HEADER_SIZE);
    const base = await subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
    const key = await subtle.deriveKey(
      { name: "PBKDF2", hash: "SHA-256", salt, iterations: ITERATIONS },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    let plain;
    try {
      plain = await subtle.decrypt({ name: "AES-GCM", iv, additionalData: MAGIC, tagLength: 128 }, key,
        bytes.slice(HEADER_SIZE));
    } catch (e) {
      // GCM fails authentication; with an intact file that means a wrong master password.
      throw new WrongPasswordError();
    }
    let doc;
    try { doc = JSON.parse(new TextDecoder().decode(plain)); } catch (e) { throw new InvalidFileError(); }
    if (!doc || !Array.isArray(doc.entries)) throw new InvalidFileError();
    return doc.entries
      .filter(e => e && !e.isDeleted)
      .map(e => ({ id: String(e.id || ""), name: String(e.name || ""), email: String(e.email || ""),
                   password: String(e.password || ""), category: String(e.category || "").trim(),
                   note: String(e.note || "") }))
      .sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: "base" }));
  }

  return { decrypt, InvalidFileError, WrongPasswordError };
})();
if (typeof module !== "undefined") module.exports = PasswortSafeCore;
// </core>

if (typeof document !== "undefined") (() => {
  // ---------------- texts (German default, Romanian when the iPhone is set to Romanian) ----------------
  const TEXTS = {
    de: {
      appName: "Passwort-Safe",
      intro: "Öffne deine Passwort-Safe-Datei (z. B. aus Google Drive) und gib dein Master-Passwort ein.",
      chooseFile: "Datei wählen", masterPassword: "Master-Passwort", open: "Öffnen",
      opening: "Wird geöffnet …",
      readOnlyHint: "Nur zum Ansehen und Kopieren. Neue Einträge und Änderungen am PC (Windows-App) oder am Android-Handy. " +
        "Alles bleibt auf diesem iPhone – nichts wird gesendet.",
      wrongPassword: "Falsches Master-Passwort.", invalidFile: "Diese Datei ist keine Passwort-Safe-Datei.",
      unreadable: "Die Datei konnte nicht gelesen werden.", noCrypto: "Dieser Browser unterstützt die Entschlüsselung nicht.",
      lock: "Sperren", back: "‹ Zurück", search: "Suchen", all: "Alle", noFolder: "Ohne Ordner",
      empty: "Keine Einträge.", noResults: "Keine Treffer.",
      name: "Name", email: "E-Mail", password: "Passwort", folder: "Ordner", note: "Bemerkung",
      copy: "Kopieren", show: "Anzeigen", hide: "Verbergen", copied: "Kopiert.", copyFailed: "Kopieren nicht möglich.",
      locked: "Gesperrt – zum Öffnen Datei und Master-Passwort erneut eingeben.",
    },
    ro: {
      appName: "Passwort-Safe",
      intro: "Deschide fișierul Passwort-Safe (de ex. din Google Drive) și scrie parola principală.",
      chooseFile: "Alege fișierul", masterPassword: "Parola principală", open: "Deschide",
      opening: "Se deschide …",
      readOnlyHint: "Doar pentru vizualizare și copiere. Intrări noi și modificări pe PC (aplicația Windows) sau pe telefonul Android. " +
        "Totul rămâne pe acest iPhone – nu se trimite nimic.",
      wrongPassword: "Parolă principală greșită.", invalidFile: "Acest fișier nu este un fișier al seifului.",
      unreadable: "Fișierul nu a putut fi citit.", noCrypto: "Acest browser nu poate decripta fișierul.",
      lock: "Blochează", back: "‹ Înapoi", search: "Caută", all: "Toate", noFolder: "Fără dosar",
      empty: "Nicio intrare.", noResults: "Niciun rezultat.",
      name: "Name", email: "E-mail", password: "Parola", folder: "Dosar", note: "Bemerkung",
      copy: "Copiază", show: "Arată", hide: "Ascunde", copied: "Copiat.", copyFailed: "Copierea nu a fost posibilă.",
      locked: "Blocat – pentru deschidere alegi din nou fișierul și parola principală.",
    },
  };
  const lang = (navigator.language || "de").toLowerCase().startsWith("ro") ? "ro" : "de";
  const T = TEXTS[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = T[el.dataset.t]; });

  // ---------------- state ----------------
  const $ = id => document.getElementById(id);
  let fileBytes = null, fileLabel = "", entries = [], folder = null, query = "", openId = null;
  let lastActivity = Date.now(), hiddenSince = null, clipTimer = null;
  const IDLE_LOCK_MS = 5 * 60 * 1000;     // like the Windows app
  const BACKGROUND_LOCK_MS = 2 * 60 * 1000; // short app switches (copy → paste) keep the safe open
  const CLIPBOARD_CLEAR_MS = 30 * 1000;

  function show(screen) {
    ["start", "vault", "detail"].forEach(s => { $(s).hidden = s !== screen; });
    window.scrollTo(0, 0);
  }
  function toast(text) {
    const t = $("toast");
    t.textContent = text; t.classList.add("show");
    clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove("show"), 2200);
  }
  function el(tag, props = {}, children = []) {
    const n = document.createElement(tag);
    Object.entries(props).forEach(([k, v]) => { if (k === "on") Object.entries(v).forEach(([e, f]) => n.addEventListener(e, f)); else n[k] = v; });
    children.forEach(c => n.append(c));
    return n;
  }

  // ---------------- start screen ----------------
  function updateOpenButton() { $("openBtn").disabled = !fileBytes || !$("pw").value; }
  $("file").addEventListener("change", async () => {
    const f = $("file").files[0];
    $("startError").hidden = true;
    if (!f) return;
    try {
      fileBytes = new Uint8Array(await f.arrayBuffer());
      fileLabel = f.name;
      $("fileName").textContent = f.name;
    } catch (e) {
      fileBytes = null; showStartError(T.unreadable);
    }
    $("file").value = "";
    updateOpenButton();
    $("pw").focus();
  });
  $("pw").addEventListener("input", updateOpenButton);
  $("pw").addEventListener("keydown", e => { if (e.key === "Enter" && !$("openBtn").disabled) openSafe(); });
  $("openBtn").addEventListener("click", openSafe);

  function showStartError(text) { $("startError").textContent = text; $("startError").hidden = false; }

  async function openSafe() {
    if (!window.crypto || !crypto.subtle) { showStartError(T.noCrypto); return; }
    const btn = $("openBtn");
    btn.disabled = true; btn.textContent = T.opening; $("startError").hidden = true;
    try {
      entries = await PasswortSafeCore.decrypt(fileBytes, $("pw").value);
      $("pw").value = "";
      folder = null; query = ""; $("search").value = "";
      $("vaultFile").textContent = fileLabel;
      lastActivity = Date.now();
      renderList(); show("vault");
    } catch (e) {
      showStartError(e instanceof PasswortSafeCore.WrongPasswordError ? T.wrongPassword
        : e instanceof PasswortSafeCore.InvalidFileError ? T.invalidFile : T.unreadable);
    } finally {
      btn.textContent = T.open; updateOpenButton();
    }
  }

  // ---------------- list ----------------
  $("search").placeholder = T.search;
  $("search").addEventListener("input", () => { query = $("search").value.trim().toLowerCase(); renderList(); });

  function folderCounts() {
    const counts = new Map();
    entries.forEach(e => counts.set(e.category, (counts.get(e.category) || 0) + 1));
    return [...counts.entries()].sort((a, b) => a[0].localeCompare(b[0], undefined, { sensitivity: "base" }));
  }

  function renderList() {
    const counts = folderCounts();
    if (folder !== null && !counts.some(([f]) => f === folder)) folder = null;
    const chips = $("folders"); chips.replaceChildren();
    const chip = (label, value) => el("button", {
      className: "chip" + (folder === value ? " on" : ""), textContent: label,
      on: { click: () => { folder = value; renderList(); } } });
    chips.append(chip(`${T.all} (${entries.length})`, null));
    // A single folder only repeats "Alle"; chips help when there is more than one.
    if (counts.length > 1 || (counts.length === 1 && counts[0][0] !== "")) {
      counts.forEach(([f, n]) => chips.append(chip(`${f || T.noFolder} (${n})`, f)));
    }

    const visible = entries
      .filter(e => folder === null || e.category === folder)
      .filter(e => !query || [e.name, e.email, e.category, e.note].some(v => v.toLowerCase().includes(query)));
    const list = $("entries"); list.replaceChildren();
    visible.forEach(e => {
      const text = el("button", { className: "open", on: { click: () => openDetail(e.id) } }, [
        ...(folder === null && e.category ? [el("div", { className: "over", textContent: e.category })] : []),
        el("div", { className: "title", textContent: e.name || "—" }),
        ...(e.email ? [el("div", { className: "sub", textContent: e.email })] : []),
      ]);
      const copyBtn = el("button", { className: "icon-btn", textContent: T.copy, disabled: !e.password,
        on: { click: () => copy(e.password) } });
      copyBtn.setAttribute("aria-label", `${T.copy}: ${T.password}`);
      list.append(el("li", {}, [text, copyBtn]));
    });
    $("entries").hidden = visible.length === 0;
    $("emptyHint").hidden = visible.length !== 0;
    $("emptyHint").textContent = entries.length === 0 ? T.empty : T.noResults;
  }

  // ---------------- detail ----------------
  function openDetail(id) {
    const e = entries.find(x => x.id === id);
    if (!e) return;
    openId = id;
    $("detailTitle").textContent = e.name || "—";
    const body = $("detailBody"); body.replaceChildren();
    const row = (label, value, opts = {}) => {
      if (!value) return;
      const span = el("span", { textContent: opts.secret ? "••••••••••" : value, className: opts.secret ? "mono" : "" });
      const buttons = [];
      if (opts.secret) {
        let visible = false;
        buttons.push(el("button", { className: "icon-btn", textContent: T.show, on: { click: ev => {
          visible = !visible; span.textContent = visible ? value : "••••••••••";
          ev.currentTarget.textContent = visible ? T.hide : T.show; } } }));
      }
      if (opts.copy) buttons.push(el("button", { className: "icon-btn", textContent: T.copy, on: { click: () => copy(value) } }));
      body.append(el("div", { className: "row" }, [el("div", { className: "k", textContent: label }),
        el("div", { className: "v" }, [span, ...buttons])]));
    };
    row(T.name, e.name, { copy: true });
    row(T.email, e.email, { copy: true });
    row(T.password, e.password, { secret: true, copy: true });
    row(T.folder, e.category);
    row(T.note, e.note, { copy: true });
    show("detail");
  }
  $("backBtn").addEventListener("click", () => { openId = null; show("vault"); });

  // ---------------- clipboard ----------------
  async function copy(text) {
    try {
      await navigator.clipboard.writeText(text);
      toast(T.copied);
      clearTimeout(clipTimer);
      // Best effort: iOS may refuse to change the clipboard without a tap, then it simply stays.
      clipTimer = setTimeout(() => { navigator.clipboard.writeText("").catch(() => {}); }, CLIPBOARD_CLEAR_MS);
    } catch (e) {
      toast(T.copyFailed);
    }
  }

  // ---------------- locking ----------------
  function lock(message) {
    entries = []; fileBytes = null; fileLabel = ""; openId = null; folder = null; query = "";
    $("entries").replaceChildren(); $("detailBody").replaceChildren(); $("folders").replaceChildren();
    $("fileName").textContent = ""; $("pw").value = ""; $("search").value = "";
    updateOpenButton(); show("start");
    if (message) toast(message);
  }
  $("lockBtn").addEventListener("click", () => lock());
  ["pointerdown", "keydown", "scroll"].forEach(ev => document.addEventListener(ev, () => { lastActivity = Date.now(); }, { passive: true }));
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { hiddenSince = Date.now(); return; }
    if (hiddenSince && entries.length && Date.now() - hiddenSince > BACKGROUND_LOCK_MS) lock(T.locked);
    hiddenSince = null;
  });
  setInterval(() => { if (!$("vault").hidden || !$("detail").hidden) {
    if (Date.now() - lastActivity > IDLE_LOCK_MS) lock(T.locked);
  } }, 10000);
  // Leaving or reloading the page drops everything anyway; make sure nothing survives in the back/forward cache.
  window.addEventListener("pagehide", () => lock());
})();
</script>
</body>
</html>
